databases:
  - name: carehub-db
    plan: free
    databaseName: carehub
    user: carehub

services:
  - type: web
    name: carehub-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carehub-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false